# Android Gradle Properties
# Place this file at: android/gradle.properties

# ==================== CRITICAL FIX ====================
# Disable Kotlin incremental compilation
# This fixes the cross-drive cache corruption error
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.js.ir=false

# ==================== MEMORY ====================
# Increase JVM memory for large builds
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# ==================== ANDROID ====================
# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Disable R8 full mode (can cause issues)
android.enableR8.fullMode=false

# ==================== GRADLE ====================
# Disable caching (prevents cross-drive path issues)
org.gradle.caching=false

# Gradle daemon settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# ==================== FLUTTER ====================
# Flutter specific (if needed)
# flutter.minSdkVersion=21